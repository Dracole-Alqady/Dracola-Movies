<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRACOLE MOVIES | THE MASTERPIECE</title>
    <script src="https://tailwindcss.com"></script>
    <style>
        @import url('https://googleapis.com');
        body { background: #020202; color: white; font-family: 'Cairo', sans-serif; overflow-x: hidden; }
        .glass { background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(220, 38, 38, 0.3); }
        .neon-card { transition: 0.4s; border: 1px solid #111; position: relative; }
        .neon-card:hover { border-color: #dc2626; box-shadow: 0 0 30px rgba(220, 38, 38, 0.4); transform: scale(1.05); }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #dc2626; border-radius: 10px; }
        .hero-bg { mask-image: linear-gradient(to top, transparent, black); }
    </style>
</head>
<body>
    <!-- الهيدر والتنقل -->
    <nav class="p-4 glass sticky top-0 z-50 flex flex-wrap justify-between items-center px-8 md:px-16">
        <div class="flex items-center gap-8">
            <a href="#" onclick="navigate('home')" class="text-4xl font-black text-red-600 tracking-tighter drop-shadow-[0_0_10px_rgba(220,38,38,0.5)]">DRACOLE<span class="text-white">MOVIES</span></a>
            <div class="hidden md:flex gap-6 text-sm font-bold text-gray-400">
                <a href="#" onclick="navigate('genre', 28)" class="hover:text-red-500 transition">أكشن</a>
                <a href="#" onclick="navigate('genre', 27)" class="hover:text-red-500 transition">رعب</a>
                <a href="#" onclick="navigate('genre', 878)" class="hover:text-red-500 transition">خيال علمي</a>
            </div>
        </div>
        <form onsubmit="handleSearch(event)">
            <input type="text" id="searchInput" placeholder="ابحث عن فيلمك..." class="bg-black border border-gray-800 rounded-full px-6 py-2 text-sm focus:outline-none focus:border-red-600 w-64 text-white">
        </form>
    </nav>

    <!-- حاوية المحتوى الديناميكي المتغير -->
    <div id="main-content"></div>

    <!-- الفوتر -->
    <footer class="p-16 text-center border-t border-gray-900 mt-20">
        <h2 class="text-2xl font-black text-red-600 mb-4 italic">DRACOLE MOVIES</h2>
        <p class="text-gray-600 text-sm">تم تطوير هذا الموقع بواسطة <br> <span class="text-white font-bold text-lg">Ahmed El kady</span></p>
    </footer>

    <script>
        const API_KEY = "c2b1d2b1fd5d6e3b5b660c57fb691db4";
        // استخدام سيرفر وسيط لحل مشكلة حظر الأمان CORS أونلاين
        const PROXY_URL = "https://allorigins.win";
        const TMDB_URL = "https://themoviedb.org";

        async function fetchData(endpoint, params = {}) {
            const targetUrl = new URL(TMDB_URL + endpoint);
            targetUrl.searchParams.append('api_key', API_KEY);
            targetUrl.searchParams.append('language', 'ar');
            for (let key in params) {
                targetUrl.searchParams.append(key, params[key]);
            }
            
            try {
                // الاتصال عبر البروكسي لتخطي الحظر
                const response = await fetch(PROXY_URL + encodeURIComponent(targetUrl.href));
                const data = await response.json();
                return JSON.parse(data.contents);
            } catch (error) {
                console.error("Error fetching data:", error);
                return {};
            }
        }

        function navigate(view, id = null) {
            window.scrollTo({ top: 0, behavior: 'smooth' });
            if (view === 'home') loadHomePage();
            if (view === 'movie') loadMovieDetailsPage(id);
            if (view === 'genre') loadGenrePage(id);
        }

        async function loadHomePage() {
            const container = document.getElementById('main-content');
            container.innerHTML = `<div class="p-20 text-center text-gray-500 text-xl">جاري تحميل الأفلام الحصرية من السيرفر...</div>`;

            const data = await fetchData("trending/movie/week");
            const movies = data.results || [];
            const top = movies.length > 0 ? movies[0] : null;

            let heroHtml = '';
            if (top) {
                heroHtml = `
                <div class="relative h-[70vh] flex items-center px-8 md:px-16 shadow-2xl">
                    <img src="https://tmdb.org{top.backdrop_path}" class="absolute inset-0 w-full h-full object-cover opacity-40 hero-bg">
                    <div class="relative z-10 max-w-3xl space-y-6">
                        <span class="bg-red-600 text-white px-4 py-1 rounded text-xs font-black uppercase tracking-widest">الأكثر رواجاً</span>
                        <h2 class="text-5xl md:text-8xl font-black leading-tight">${top.title}</h2>
                        <p class="text-xl text-gray-300 line-clamp-3">${top.overview || 'لا يوجد وصف متاح حالياً.'}</p>
                        <a href="#" onclick="navigate('movie', ${top.id})" class="inline-block bg-red-600 hover:bg-red-700 px-10 py-4 rounded-full font-black transition-all transform hover:scale-110">شاهد الآن</a>
                    </div>
                </div>`;
            }

            let gridHtml = '';
            movies.forEach(movie => {
                if(movie.poster_path) {
                    gridHtml += `
                    <a href="#" onclick="navigate('movie', ${movie.id})" class="neon-card group rounded-3xl overflow-hidden bg-zinc-900 shadow-2xl">
                        <img src="https://tmdb.org{movie.poster_path}" class="w-full h-[400px] object-cover group-hover:scale-110 transition duration-500" onerror="this.src='https://placeholder.com'">
                        <div class="p-4 bg-zinc-900">
                            <h4 class="font-bold truncate text-sm text-white">${movie.title}</h4>
                            <div class="flex justify-between mt-2"><span class="text-red-500 font-bold">⭐ ${movie.vote_average ? movie.vote_average.toFixed(1) : '0'}</span></div>
                        </div>
                    </a>`;
                }
            });

            container.innerHTML = `
                ${heroHtml}
                <div class="px-8 md:px-16 py-16">
                    <h3 class="text-3xl font-black border-r-8 border-red-600 pr-6 mb-12 uppercase tracking-tighter">أحدث الإصدارات</h3>
                    <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-8">
                        ${gridHtml}
                    </div>
                </div>
            `;
        }

        async function loadMovieDetailsPage(movieId) {
            const container = document.getElementById('main-content');
            container.innerHTML = `<div class="p-20 text-center text-gray-500 text-xl">جاري تشغيل سيرفر المشاهدة...</div>`;

            const movie = await fetchData(`movie/${movieId}`);
            const watchUrl = `https://vidsrc.me{movieId}`;

            container.innerHTML = `
            <div class="p-8 md:p-20 max-w-7xl mx-auto">
                <div class="glass p-2 rounded-[40px] shadow-2xl overflow-hidden border-2 border-red-600">
                    <iframe class="w-full aspect-video rounded-[35px]" src="${watchUrl}" frameborder="0" allowfullscreen></iframe>
                </div>
                <div class="mt-16 grid md:grid-cols-[300px_1fr] gap-12">
                    <img src="https://tmdb.org{movie.poster_path}" class="w-full rounded-[30px] border-4 border-zinc-800 shadow-2xl" onerror="this.src='https://placeholder.com'">
                    <div class="space-y-6 text-right">
                        <h2 class="text-4xl md:text-6xl font-black text-white italic tracking-tighter underline decoration-red-600 underline-offset-8">${movie.title}</h2>
                        <div class="flex gap-4 justify-start">
                            <span class="bg-red-600 px-6 py-1 rounded-full font-black">⭐ ${movie.vote_average ? movie.vote_average.toFixed(1) : '0'}</span>
                            <span class="bg-zinc-800 px-6 py-1 rounded-full font-bold">${movie.release_date || 'غير معروف'}</span>
                        </div>
                        <p class="text-2xl text-gray-400 leading-relaxed italic pr-6 border-r-4 border-red-600">${movie.overview || 'لا يوجد وصف متاح لهذا الفيلم.'}</p>
                        <div class="pt-8">
                            <p class="text-red-500 font-bold mb-4">⚠️ ملاحظة: السيرفر الخارجي قد يحتوي على إعلانات خارجية.</p>
                            <a href="#" onclick="navigate('home')" class="bg-white text-black px-12 py-4 rounded-full font-black text-xl hover:bg-red-600 hover:text-white transition-all">العودة للرئيسية</a>
                        </div>
                    </div>
                </div>
            </div>`;
        }

        async function handleSearch(event) {
            event.preventDefault();
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            const container = document.getElementById('main-content');
            container.innerHTML = `<div class="p-20 text-center text-gray-500 text-xl">جاري البحث عن "${query}"...</div>`;

            const data = await fetchData("search/movie", { query: query });
            const movies = data.results || [];

            let gridHtml = '';
            movies.forEach(movie => {
                if(movie.poster_path) {
                    gridHtml += `
                    <a href="#" onclick="navigate('movie', ${movie.id})" class="neon-card group rounded-3xl overflow-hidden bg-zinc-900 shadow-2xl">
